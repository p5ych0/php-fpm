[PHP]
memory_limit = 1G
log_errors = 1
error_log = /var/log/php/cli-error.log

[opcache]
; Octane, Horizon and the scheduler all run under the CLI SAPI; without this
; OPcache (and PHP_OPCACHE_PRELOAD) is inactive in every long-running worker.
opcache.enable_cli = 1

[Session]
; CVE-2026-109619: upload progress touches session state before request startup.
; Keep off even on patched PHP (GHSA-6wmf-4rv5-p3rp); Laravel/WordPress don't use it.
session.upload_progress.enabled = 0
