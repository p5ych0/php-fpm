# Base supervisord section removed; use main /etc/supervisord.conf instead
[program:worker]
process_name=%(program_name)s_%(process_num)02d
command=/var/www/html/artisan queue:work --timeout=60 --tries=5
autostart=true
autorestart=true
user=%(ENV_USER_NAME)s
; numprocs will be overridden dynamically by entrypoint based on NUMPROCS env (default 1)
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue.log
; ensure no environment= lines present (entrypoint will strip if added)
# Removed invalid environment interpolation causing supervisor failure
[program:cron]
command=/usr/sbin/crond -f
autostart=true
autorestart=true
redirect_stderr=true
