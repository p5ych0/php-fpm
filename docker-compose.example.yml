services:
  php-fpm:
    build: .
    volumes:
      - ./app:/var/www/html
      - ./storage/logs:/var/log/php
    ports:
      - "9000:9000"
      - "9099:9099"
    environment:
      - PUID=${UID:-82}
      - PGID=${GID:-82}
      - USER_NAME=${USER:-www-data}
      - GROUP_NAME=${GROUP:-www-data}
      - ENV_NUMPROCS=4
      - PHP_OPCACHE_PRELOAD=/var/www/html/bootstrap/cache/opcache.php
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: