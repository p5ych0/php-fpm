x-app-env: &app-env
  PUID: ${CUID:-82}
  PGID: ${CGID:-82}
  USER_NAME: ${CUSER:-www-data}
  GROUP_NAME: ${CGROUP:-www-data}
  AUTO_WORKERS: 1
  NUMPROCS: 0 # entrypoint will fallback to CPU count when AUTO_WORKERS=1
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  LOG_CHANNEL: stack
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  BROADCAST_DRIVER: reverb
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REVERB_APP_ID: local-app
  REVERB_APP_KEY: local-key
  REVERB_APP_SECRET: local-secret
  REVERB_HOST: 0.0.0.0
  REVERB_PORT: 8080
  REVERB_SCHEME: http

x-app-volumes: &app-volumes
  - ./laravel-app:/var/www/html:rw

services:
  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  octane:
    build:
      context: .
    container_name: laravel-octane
    working_dir: /var/www/html
    environment:
      <<: *app-env
      OCTANE_SERVER: swoole
      OCTANE_HOST: 0.0.0.0
      OCTANE_PORT: 8000
      OCTANE_WORKERS: 2
      OCTANE_TASK_WORKERS: 2
      PHP_OPCACHE_PRELOAD: /var/www/html/preload.php
      PHP_OPCACHE_FREQ: 300
    volumes: *app-volumes
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: ["php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8000"]
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS --max-time 5 http://127.0.0.1:$${OCTANE_PORT:-8000}/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue-worker:
    build:
      context: .
    container_name: laravel-worker
    working_dir: /var/www/html
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    command: ["supervisord", "-n"]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  reverb:
    build:
      context: .
    container_name: laravel-reverb
    working_dir: /var/www/html
    environment:
      <<: *app-env
      REVERB_ENABLE: 1
    volumes: *app-volumes
    depends_on:
      - redis
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep -f 'reverb:start' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redisdata:
    driver: local
